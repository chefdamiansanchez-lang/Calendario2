name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$ZIP" ]; then
              unzip -o "$ZIP" -d proyecto_zip
            fi
          fi
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "No se encontró settings.gradle.kts en el repositorio"
            exit 1
          fi
          echo "DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-DATCO-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
